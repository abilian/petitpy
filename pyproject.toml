# petitpy (developed as nanopython): wheels and sdist via ziglang + hatchling.
#
# `make release-dist` cross-builds the four wheels and the sdist; on other
# platforms `pip install petitpy` builds the sdist with ziglang in pip's
# isolated build env. See ADR 016 (docs/src/adrs/016-distribution.md).

[project]
name = "petitpy"
description = "A small Python runtime, MicroPython-compatible, written in Zig."
readme = "README.md"
license = "MIT AND PSF-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "Stefane Fermigier" }]
keywords = ["python", "micropython", "wasm", "zig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://petitpy.lab.abilian.com/"
Source = "https://git.sr.ht/~sfermigier/petitpy"

[build-system]
requires = ["hatchling>=1.29", "packaging", "ziglang==0.16.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "build.zig"
pattern = 'pub const version = "(?P<version>[^"]+)"'

[tool.hatch.build]
# Override hatchling's default of respecting .gitignore.  Several paths we
# NEED in the sdist (vendor/micropython_embed/ generated by `make port`,
# build.zig.zon .zon lock, etc.) are gitignored locally — the sdist include
# list must be authoritative.
ignore-vcs = true

[tool.hatch.build.targets.sdist]
# Authoritative: with only-include, ONLY these paths ship in the sdist.
# Prevents vendor/micropython (2.6 GB external clone), sandbox/, corpus/, docs/, notes/,
# tests/, tools/, web/, projects/, examples/, golden-programs/, .zig-cache/
# etc. from bloating the archive.  Everything zig build needs to reproduce
# the binary from a fresh extract is listed here.
#
# vendor/micropython_embed/ is gitignored locally (generated by `make port`)
# but MUST be in the sdist — the isolated pip build env has no way to
# regenerate it; run `make port` locally before `uv build`.
only-include = [
    "src",
    "port/mpconfigport.h",
    "port/Makefile",
    "port/gate_moduledefs.py",
    "vendor/micropython_embed",
    "build.zig",
    "nanopython-lib",
    "python",
    "scripts/hatch_build.py",
    "README.md",
    "LICENSE",
]

# Vendor .c files that build.zig does NOT compile under -Dconfig=full.
# The 129 py/*.c files ship at 2.8 MB compressed; build.zig references only
# 9 of them (objint*.c, mpz.c, modio.c, objstringio.c, builtinhelp.c,
# warning.c, objfloat.c, formatfloat.c).  Everything else is either
# Zig-replaced (obj*.c, runtime.c, vm.c, compile.c, lexer.c, parse.c, ...)
# or arch-specific for targets we don't support (asm*.c, emitn*.c,
# emitinline*.c, nlrmips.c, nlrpowerpc.c, ...).  Headers stay — transitive
# `#include` chains rely on py/*.h being reachable.
exclude = [
    "vendor/micropython_embed/py/argcheck.c",
    "vendor/micropython_embed/py/asmarm.c",
    "vendor/micropython_embed/py/asmbase.c",
    "vendor/micropython_embed/py/asmrv32.c",
