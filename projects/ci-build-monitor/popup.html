<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nano Build Monitor</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    /* Popup-specific: fixed width */
    body { width: 320px; font-size: 13px; }

    /* Spinner animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--color-border-subtle);
      border-top-color: var(--color-success);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="text-base">Nano Build Monitor</h1>
    <div class="flex gap-1">
      <button id="refresh-btn" class="btn btn-sm btn-secondary" title="Refresh now">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="settings-btn" class="btn btn-sm btn-secondary" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </div>

  <div id="loading" class="p-5 text-center">
    <div class="spinner"></div>
  </div>

  <div id="empty-state" class="hidden p-5 text-center text-muted">
    <p>No repositories configured</p>
    <button id="add-repo-btn" class="btn btn-primary mt-4">Add Repository</button>
  </div>

  <div id="main-content" class="hidden">
    <div id="status-summary" class="status-summary p-4 text-center">
      <div class="status-icon text-2xl mb-2">✓</div>
      <div class="status-text font-medium">All repos passing</div>
    </div>

    <div id="failures-section" class="hidden p-3">
      <h2 class="text-xs uppercase text-danger font-semibold mb-2">Needs Attention</h2>
      <div id="failures-list"></div>
    </div>

    <div id="passing-section" class="hidden flex items-center gap-1 px-4 py-2 text-sm text-success">
      <span>✓</span>
      <span id="passing-text">0 repos passing</span>
    </div>

    <div class="p-3 text-center">
      <button id="dashboard-btn" class="btn btn-secondary btn-sm">Open Dashboard</button>
    </div>
  </div>

  <script src="dist/chrome-shim.js"></script>
  <script type="module" src="dist/popup-loader.js"></script>
</body>
</html>
