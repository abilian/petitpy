[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfront"
version = "0.1.0"
description = "An alternative petitpy front-end: Python source to MicroPython .mpy v6, in pure Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["abilian-astero>=0.1.0"]

[project.scripts]
pyfront = "pyfront.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nox>=2026.8.17",
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "ty>=0.0.77",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyfront"]

[tool.uv.sources]
# Local checkout; astero is on PyPI as abilian-astero, but this project is
# developed against the working tree next door.
abilian-astero = { path = "../../../../compilers/astero", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# conftest.py applies these by directory; registering them silences the
# unknown-mark warning and makes `pytest -m unit` a documented entry point.
markers = [
    "unit: fast and isolated (tests/a_unit)",
    "integration: components together (tests/b_integration)",
    "e2e: the whole CLI or the real VM (tests/c_e2e)",
]


[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/pyfront"
src_package = "pyfront"
units = ["*"]
# counter = "internal"   # or "cloc"

# Source units to exclude from analysis (a reason is required):
# [tool.tepyd.exclude]
# faker = "why this is not tested"

# Tiers, cheapest first. Add `expects = [...]` to a tier to scope it to
# the source units it should test (glob patterns over unit names); units
# outside the scope are reported n/a, not as gaps. Use it when layers map
# to tiers — e.g. integration `expects = ["repositories/*", "infra/*"]`,
# e2e `expects = ["web/*"]`. Omit it and the tier is checked against all.

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"

[[tool.tepyd.tiers]]
name = "c_e2e"
root = "tests/c_e2e"
label = "e2e"
