<!doctype html>
<meta charset="utf-8">
<title>petitpy npm check</title>
<pre id="out">running</pre>
<p id="dom"></p>
<script type="importmap">
  { "imports": { "@bjorn3/browser_wasi_shim": "./dist/node_modules/@bjorn3/browser_wasi_shim/dist/index.js" } }
</script>
<script type="module">
  // Browser check of the assembled package (make npm-check): default wasm
  // URL next to index.js, stdout capture, and Python writing to the DOM.
  import { loadPetitpy } from "./dist/index.js";
  const out = document.getElementById("out");
  const results = [];
  try {
    const py = await loadPetitpy();
    let r = await py.run('print("hello", 6 * 7)');
    results.push(r.stdout === "hello 42\n" ? "PASS run" : "FAIL run " + JSON.stringify(r.stdout));
    r = await py.run('import js\njs.document.getElementById("dom").textContent = "set from python"');
    const dom = document.getElementById("dom").textContent;
    results.push(dom === "set from python" ? "PASS dom" : "FAIL dom " + JSON.stringify(dom + r.stderr));
    // A raise inside MicroPython's C integer code, caught through wasm
    // exception handling.
    r = await py.run("try:\n    (2**100) // 0\nexcept ZeroDivisionError:\n    print('caught')");
    results.push(r.stdout === "caught\n" ? "PASS raise" : "FAIL raise " + JSON.stringify(r.stdout + r.stderr));
    // The long-lived interpreter: state kept between calls, JS called back.
    const { loadInterpreter } = await import("./dist/embed.js");
    const ipy = await loadInterpreter();
    ipy.define("host", "double", (n) => 2 * n);
    ipy.exec("import host, js\ndef f(x):\n    return host.double(x) + 1");
    const got = [ipy.call("f", 20), ipy.call("f", 1), ipy.eval("str(js.document.title)")];
    results.push(JSON.stringify(got) === JSON.stringify([41, 3, document.title]) ? "PASS embed" : "FAIL embed " + JSON.stringify(got));
  } catch (e) {
    results.push("FAIL load " + e);
  }
  const passed = results.filter((x) => x.startsWith("PASS")).length;
  out.textContent = results.join("\n") + `\n${passed} of ${results.length} passed`;
</script>
