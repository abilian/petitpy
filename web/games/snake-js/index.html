<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake-js &mdash; nanopython demos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared.css">
<style>
  .board-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; }
  .scoreline { display: flex; gap: 24px; font-family: var(--mono); font-size: 14px; }
  .scoreline .label { color: var(--fg-dim); text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; margin-right: 6px; }
  .help { color: var(--fg-dim); font-size: 12px; }
  canvas#board { outline: 1px solid var(--border); }
</style>
</head>
<body>
<main>
  <div class="crumb"><a href="../../">nanopython</a> &nbsp;/&nbsp; snake-js</div>
  <header>
    <h1>Snake-js</h1>
    <p class="lede">JavaScript version of <a href="../snake-lite/">snake-lite</a>, using <code>web/lib/nanopy.js</code> &mdash; the JS twin of <code>web/lib/nanopy.py</code> with the same API names. Same game, same library shape, different language.</p>
  </header>
  <p class="status" id="status">Loading&hellip;</p>
  <div class="board-wrap">
    <div class="scoreline">
      <div><span class="label">Score</span><span id="score">0</span></div>
      <div><span class="label">High</span><span id="high">0</span></div>
    </div>
    <canvas id="board" width="400" height="400"
            role="img" aria-label="Snake game board, 20 by 20 grid"></canvas>
    <p class="help">Arrow keys or WASD to steer. R to restart.</p>
  </div>
  <section class="source" data-files="main.js"></section>
</main>
<script type="module" src="../../lib/show-source.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
